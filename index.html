<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillHub - Online Learning Platform</title><link rel="stylesheet" href="style.css"></head>
<body><header class="top"><h1>Skill<span>Hub</span></h1><p>Pick a course, enroll, and track your progress.</p></header>
<main>
<section class="mine" aria-label="My learning"><h2>My learning <small id="count"></small></h2><div id="mine" class="mine-list"></div></section>
<section aria-label="Course catalog"><h2>All courses</h2>
<div class="tools"><label class="sr" for="q">Search courses</label><input id="q" type="search" placeholder="Search courses">
<div id="cats" class="chips" role="group" aria-label="Category"></div></div>
<div id="courses" class="grid"></div><p id="none" hidden>No courses found.</p></section></main>
<script src="script.js"></script></body></html>
